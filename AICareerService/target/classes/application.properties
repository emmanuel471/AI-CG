spring.application.name=ai-career-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.config.ignoreUnresolvablePlaceholders=true

#JWT Config
jwt.secret=${JWT_SECRET}

# AWS credentials
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
spring.cloud.aws.credentials.access-key-id=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-access-key=${AWS_SECRET_KEY}
spring.cloud.aws.region.static=${AWS_REGION}

#CLOUD FRONT
cloudfront.domain=${CLOUDFRONT_DOMAIN}
cloudfront.private-key=${CLOUDFRONT_PRIVATE_KEY}
cloudfront.key-pair-id=${CLOUDFRONT_KEY_PAIR_ID}

# S3
application.bucket.name=${APPLICATION_BUCKET_NAME}

# SQS
aws.sqs.queue.user-notification-events=${SQS_USER_NOTIFICATION_EVENTS_URL}

# Anthropic Claude API
anthropic.api-key=${ANTHROPIC_API_KEY}

# AI analysis cron schedule (default: every 24 hours at 2am)
ai.analysis.cron=0 0 2 * * *

# How many days before an analysis is considered stale
ai.analysis.stale-after-days=7

# Claude model to use for analysis
ai.analysis.model-version=claude-sonnet-4-6
